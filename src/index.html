<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator · Front-End / Back-End Separation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <h1>🧮 Calculator</h1>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="layout">
      <!-- Calculator -->
      <section class="calculator card">
        <div class="display">
          <div id="expression" class="expression" placeholder="0"></div>
          <div id="result" class="result">0</div>
        </div>

        <div class="error-bar" id="error-bar" hidden></div>

        <div class="keypad">
          <button class="key key-fn" data-action="clear">AC</button>
          <button class="key key-fn" data-action="backspace">DEL</button>
          <button class="key key-fn" data-value="(">(</button>
          <button class="key key-fn" data-value=")">)</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key key-op" data-value="/">÷</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key key-op" data-value="*">×</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key key-op" data-value="-">−</button>

          <button class="key" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key key-eq" data-action="equals">=</button>
          <button class="key key-op" data-value="+">+</button>
        </div>
      </section>

      <!-- History -->
      <section class="history card">
        <div class="history-header">
          <h2>History</h2>
          <div>
            <span id="history-count" class="badge">0</span>
            <button id="clear-all" class="text-btn danger">Clear All</button>
          </div>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">No records yet</li>
        </ul>
      </section>
    </main>

    <!-- Footer: backend API configuration -->
    <footer class="footer">
      <label for="api-base">Backend API:</label>
      <input id="api-base" type="text" spellcheck="false" />
      <button id="save-api" class="text-btn">Save</button>
      <span id="conn-status" class="conn-status">Disconnected</span>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
